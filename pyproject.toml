[project]
name = "productividad-asesores-negocios"
version = "0.1.0"
description = "Microfinance advisor portfolio risk classification — MLOps portfolio project"
requires-python = ">=3.11"

dependencies = [
    # Data
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pyarrow>=16.0.0",
    # ML
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "optuna>=3.6.0",
    # Interpretabilidad
    "shap>=0.46.0",
    # Tracking
    "mlflow>=2.15.0",
    # Dashboard
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    # Utilidades
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_risk"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
